<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    background: linear-gradient(135deg,#0f172a,#020617);
    color:white;
    font-family:Arial;
    text-align:center;
}

h2 { margin-top:20px; }

.card {
    background:#1e293b;
    margin:10px;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(0,0,0,0.5);
}

.value {
    color:#22c55e;
    font-size:22px;
    margin-top:10px;
}

button {
    padding:15px;
    margin:10px;
    border:none;
    border-radius:12px;
    background:#38bdf8;
    font-size:16px;
    color:white;
}

</style>
</head>

<body>

<h2>🚀 Alpha Dashboard</h2>

<div class="card">💰 Balance <div id="b" class="value">...</div></div>
<div class="card">📊 Trades <div id="t" class="value">...</div></div>
<div class="card">🔥 WinRate <div id="w" class="value">...</div></div>

<button onclick="startTrade()">🚀 Start Trade</button>

<script>
function load(){
fetch("/data")
.then(r=>r.json())
.then(d=>{
document.getElementById("b").innerText="$"+d.balance
document.getElementById("t").innerText=d.trades
document.getElementById("w").innerText=d.winrate+"%"
})
}

setInterval(load,2000)
load()

function startTrade(){
fetch("/start_trade")
alert("تم تنفيذ الصفقة 🚀")
}
</script>

</body>
</html>
